<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanessa Kistela Fotografia</title>
  <!--
  ╔══════════════════════════════════════════════════════╗
  ║  STRUKTURA FOLDERÓW W REPOZYTORIUM                  ║
  ║                                                      ║
  ║  /logo/          →  logo.png (lub .svg)              ║
  ║  /carousel/      →  01.jpg, 02.jpg, 03.jpg, ...      ║
  ║  /photo_of_me/   →  me.jpg                           ║
  ║  /portfolio/     →  01.jpg, 02.jpg, 03.jpg, ...      ║
  ║                                                      ║
  ║  Wszystkie teksty edytujesz w obiekcie CONTENT       ║
  ║  poniżej — bez dotykania reszty kodu.                ║
  ╚══════════════════════════════════════════════════════╝
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

<!-- ════════════════════════════════════════════════════════════
     ✏️  EDYTUJ TUTAJ — wszystkie teksty strony → js/index.js
     ════════════════════════════════════════════════════════════ -->

<!-- NAV -->
<nav id="nav">
  <a class="logo" href="#hero"><img src="https://images.pexels.com/photos/30818585/pexels-photo-30818585/free-photo-of-bukiet-z-zywych-gerber-i-tulipanow.jpeg?auto=compress&cs=tinysrgb&w=200" alt="Wanessa Kistela"></a>
  <ul id="nav-links">
    <li><a href="#o-mnie">O mnie</a></li>
    <li><a href="portfolio.html">Portfolio</a></li>
    <li><a href="#opinie">Opinie</a></li>
    <li><a href="#kontakt">Kontakt</a></li>
  </ul>
  <a class="nav-cta" href="#kontakt">Zapytaj o sesję</a>
  <button class="nav-burger" id="nav-burger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- MOBILE NAV OVERLAY -->
<div class="mobile-nav" id="mobile-nav">
  <button class="mobile-nav-close" id="mobile-nav-close">&#10005;</button>
  <ul>
    <li><a href="#o-mnie">O mnie</a></li>
    <li><a href="portfolio.html">Portfolio</a></li>
    <li><a href="#opinie">Opinie</a></li>
    <li><a href="#kontakt">Kontakt</a></li>
    <li><a href="#kontakt" class="mobile-nav-cta">Zapytaj o sesję</a></li>
  </ul>
</div>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="carousel-track" id="track"></div>
  <div class="hero-content">
    <h1 id="hHero"></h1>
    <p  id="hSub"></p>
    <a  id="hCta" class="hero-cta" href="#kontakt"></a>
  </div>
  <div class="carousel-arrows">
    <button class="arrow" id="prev">&#8592;</button>
    <button class="arrow" id="next">&#8594;</button>
  </div>
  <div class="carousel-dots" id="dots"></div>
</section>

<!-- ABOUT -->
<section class="about" id="o-mnie">
  <div class="about-img reveal">
    <img src="photo_of_me/065A3669.jpg" alt="Wanessa Kistela — fotograf">
  </div>
  <div class="about-text reveal delay-1">
    <p class="section-tag" id="aTag"></p>
    <h2 id="aHead"></h2>
    <div id="aPara"></div>
    <p class="about-signature" id="aSig"></p>
  </div>
</section>

<!-- PORTFOLIO -->
<section class="portfolio" id="portfolio">
  <div class="section-header reveal">
    <p class="section-tag" id="pTag"></p>
    <h2 id="pHead"></h2>
    <p id="pSub"></p>
  </div>
  <div class="portfolio-grid" id="pGrid"></div>
</section>

<!-- OPINIONS -->
<section class="opinions" id="opinie">
  <div class="section-header reveal">
    <p class="section-tag" id="opTag"></p>
    <h2 id="opHead"></h2>
  </div>
  <div class="opinions-inner reveal delay-1">
    <div class="opinions-viewport">
      <div class="opinions-track" id="opTrack"></div>
    </div>
  </div>
  <div class="opinions-controls reveal delay-2">
    <button class="op-arrow" id="opPrev">&#8592;</button>
    <div class="op-dots" id="opDots"></div>
    <button class="op-arrow" id="opNext">&#8594;</button>
  </div>
</section>

<!-- CONTACT -->
<section class="contact" id="kontakt">
  <div class="contact-left reveal">
    <p class="section-tag" id="cTag"></p>
    <h2 id="cHead"></h2>
    <p id="cSub" style="color:var(--muted);line-height:1.8;font-size:.97rem;margin-bottom:2.5rem;"></p>
    <div class="contact-items" id="cDet"></div>
  </div>
  <div class="contact-photo reveal delay-1">
    <img src="photo_of_me/065A3669.jpg" alt="Wanessa Kistela">
  </div>
</section>

<footer id="foot" class="reveal"></footer>

<script src="js/index.js"></script>
</body>
</html>
