  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #FAF7F2;
      --bg2:         #F3EDE5;
      --yellow:      #FFD882;
      --orange:      #F04E23;
      --pink:        #F07DC6;
      --purple-lt:   #D4A0F0;
      --purple:      #A855C8;
      --purple-dark: #4A1E6B;
      --text:        #2D1840;
      --muted:       #8B6FA0;
      --white:       #FFFFFF;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }

    /* ── NAV ── */
    nav {
      position:fixed; top:0; left:0; right:0; z-index:200;
      display:flex; justify-content:space-between; align-items:center;
      padding:1.1rem 4rem;
      background:rgba(250,247,242,0.92);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(168,85,200,0.12);
      transition:box-shadow .3s;
    }
    nav .logo img {
      width:46px; height:46px; display:block;
      border-radius:50%; object-fit:cover;
      border:2px solid rgba(168,85,200,.2);
    }
    nav ul { list-style:none; display:flex; gap:2.5rem; }
    nav ul a {
      text-decoration:none; color:var(--purple-dark);
      font-size:.85rem; font-weight:500;
      letter-spacing:.06em; text-transform:uppercase;
      transition:color .2s;
    }
    nav ul a:hover { color:var(--orange); }
    .nav-cta {
      background:var(--orange); color:#fff; text-decoration:none;
      padding:.6rem 1.6rem; border-radius:50px;
      font-family:'Poppins',sans-serif; font-size:.82rem; font-weight:600;
      transition:background .2s, transform .15s;
    }
    .nav-cta:hover { background:#d43d15; transform:scale(1.04); }

    /* ── HERO CAROUSEL ── */
    .hero { position:relative; height:100vh; min-height:580px; overflow:hidden; }
    .carousel-track { display:flex; height:100%; transition:transform .75s cubic-bezier(.77,0,.175,1); }
    .carousel-slide { min-width:100%; height:100%; position:relative; overflow:hidden; }
    .carousel-slide img { width:100%; height:100%; object-fit:cover; display:block; }
    .slide-overlay {
      position:absolute; inset:0;
      background:linear-gradient(160deg, rgba(74,30,107,.05) 0%, rgba(45,24,64,.45) 100%);
    }

    .hero-content {
      position:absolute; bottom:10%; left:4rem; z-index:10; max-width:600px;
    }
    .hero-content h1 {
      font-family:'Poppins',sans-serif;
      font-size:clamp(2.4rem,5vw,4rem); font-weight:800;
      color:#fff; line-height:1.1; margin-bottom:1rem;
    }
    .hero-content p {
      color:rgba(255,255,255,.82); font-size:1.05rem;
      font-weight:300; line-height:1.7; margin-bottom:2rem;
    }
    .hero-cta {
      display:inline-block; background:var(--orange); color:#fff;
      text-decoration:none; padding:.9rem 2.2rem; border-radius:50px;
      font-family:'Poppins',sans-serif; font-weight:600; font-size:.95rem;
      transition:background .2s, transform .15s;
    }
    .hero-cta:hover { background:#d43d15; transform:translateY(-2px); }
    .hero-content b, .hero-content strong { font-weight:700; }

    .carousel-arrows {
      position:absolute; top:50%; transform:translateY(-50%);
      width:100%; padding:0 1.5rem; display:flex;
      justify-content:space-between; z-index:10; pointer-events:none;
    }
    .arrow {
      pointer-events:all; width:44px; height:44px; border-radius:50%;
      background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);
      backdrop-filter:blur(4px); color:#fff; font-size:1.1rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background .2s;
    }
    .arrow:hover { background:rgba(255,255,255,.3); }
    .carousel-dots {
      position:absolute; bottom:2rem; right:4rem;
      display:flex; gap:.55rem; z-index:10;
    }
    .dot {
      width:8px; height:8px; border-radius:50%;
      background:rgba(255,255,255,.4); cursor:pointer;
      transition:background .3s, transform .3s;
    }
    .dot.active { background:#fff; transform:scale(1.45); }

    /* ── ABOUT ── */
    .about { display:grid; grid-template-columns:1fr 1fr; min-height:88vh; }
    .about-img { position:relative; overflow:hidden; }
    .about-img img { width:100%; height:100%; object-fit:cover; }
    .about-img::after {
      content:''; position:absolute; bottom:0; right:0;
      width:130px; height:130px;
      background:var(--yellow); border-radius:50% 0 0 0;
    }
    .about-text {
      padding:6rem 5rem; background:var(--bg2);
      display:flex; flex-direction:column; justify-content:center;
    }
    .section-tag {
      font-size:.72rem; font-weight:700;
      letter-spacing:.16em; text-transform:uppercase;
      color:var(--orange); margin-bottom:.9rem;
    }
    .about-text h2 {
      font-family:'Poppins',sans-serif;
      font-size:clamp(1.8rem,2.8vw,2.6rem); font-weight:800;
      color:var(--purple-dark); line-height:1.2; margin-bottom:1.5rem;
    }
    .about-text p {
      color:var(--muted); line-height:1.85;
      font-size:.98rem; margin-bottom:1rem;
    }
    .about-signature {
      font-family:'Poppins',sans-serif; font-size:1.4rem;
      font-weight:700; color:var(--purple); margin-top:1.5rem;
    }

    /* ── PORTFOLIO ── */
    .portfolio { padding:6rem 4rem; background:var(--bg); }
    .section-header { text-align:center; margin-bottom:3.5rem; }
    .section-header h2 {
      font-family:'Poppins',sans-serif;
      font-size:clamp(1.8rem,2.8vw,2.6rem); font-weight:800;
      color:var(--purple-dark); margin-bottom:.6rem;
    }
    .section-header p { color:var(--muted); font-size:.97rem; max-width:480px; margin:0 auto; }

    .portfolio-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:1rem;
    }
    .p-item {
      position:relative; overflow:hidden;
      border-radius:14px; cursor:pointer;
    }
    .p-item:nth-child(1) { aspect-ratio:3/4; }
    .p-item:nth-child(2) { aspect-ratio:3/4; margin-top:2.5rem; }
    .p-item:nth-child(3) { aspect-ratio:3/4; }
    .p-item:nth-child(4) { aspect-ratio:3/4; }
    .p-item:nth-child(5) { aspect-ratio:3/4; margin-top:-2.5rem; }
    .p-item:nth-child(6) { aspect-ratio:3/4; }
    .p-item img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; display:block; }
    .p-item:hover img { transform:scale(1.06); }
    .p-overlay {
      position:absolute; inset:0;
      background:linear-gradient(to top,rgba(74,30,107,.55) 0%,transparent 55%);
      opacity:0; transition:opacity .3s;
    }
    .p-item:hover .p-overlay { opacity:1; }

    /* ── OPINIONS ── */
    .opinions { padding:6rem 4rem; background:var(--bg2); overflow:hidden; }
    .opinions-inner { max-width:960px; margin:0 auto; }
    .opinions-viewport { overflow:hidden; }
    .opinions-track {
      display:flex;
      transition:transform .65s cubic-bezier(.4,0,.2,1);
    }
    .opinion-slide {
      min-width:100%;
      display:grid;
      grid-template-columns:1fr 1.05fr;
      gap:80px;
      align-items:center;
    }
    .opinion-photo {
      aspect-ratio:3/4;
      border-radius:14px; overflow:hidden;
    }
    .opinion-photo img { width:100%; height:100%; object-fit:cover; display:block; }
    .opinion-body { display:flex; flex-direction:column; justify-content:center; }
    .opinion-name {
      font-family:'Poppins',sans-serif; font-size:1.2rem;
      font-weight:700; color:var(--purple-dark); margin-bottom:.25rem;
    }
    .opinion-session {
      font-size:.78rem; font-weight:600; letter-spacing:.1em;
      text-transform:uppercase; color:var(--orange); margin-bottom:1.2rem;
    }
    .opinion-quote {
      color:var(--muted); line-height:1.85; font-size:1rem;
      font-style:italic;
    }
    .opinion-quote::before { content:'\201C'; font-size:2rem; color:var(--purple-lt); line-height:0; vertical-align:-.4em; margin-right:.2rem; }
    .opinions-controls {
      display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:2.5rem;
    }
    .op-arrow {
      width:40px; height:40px; border-radius:50%;
      background:var(--purple-dark); color:#fff; border:none;
      font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background .2s;
    }
    .op-arrow:hover { background:var(--orange); }
    .op-dots { display:flex; gap:.5rem; }
    .op-dot {
      width:8px; height:8px; border-radius:50%;
      background:rgba(74,30,107,.2); border:none; cursor:pointer;
      transition:background .3s, transform .3s;
    }
    .op-dot.active { background:var(--purple); transform:scale(1.45); }

    /* ── CONTACT ── */
    .contact {
      display:grid; grid-template-columns:1fr 1fr; min-height:85vh;
      background:var(--bg);
    }
    .contact-left {
      padding:6rem 5rem;
      display:flex; flex-direction:column; justify-content:center;
    }
    .contact-left h2 {
      font-family:'Poppins',sans-serif;
      font-size:clamp(2.2rem,3.5vw,3.4rem); font-weight:800;
      color:var(--purple-dark); line-height:1.1; margin-bottom:3rem;
    }
    .contact-items { display:flex; flex-direction:column; gap:2.2rem; }
    .c-item { display:flex; align-items:flex-start; gap:1rem; }
    .c-icon-wrap {
      width:38px; height:38px; border-radius:50%; flex-shrink:0;
      background:var(--bg2); display:flex; align-items:center; justify-content:center;
      margin-top:.15rem;
    }
    .c-icon-wrap svg { width:16px; height:16px; stroke:var(--purple); }
    .c-item-text { display:flex; flex-direction:column; gap:.3rem; }
    .c-label {
      font-size:.68rem; font-weight:700; letter-spacing:.18em;
      text-transform:uppercase; color:var(--muted);
    }
    .c-value {
      font-size:1.05rem; font-weight:500;
      color:var(--purple-dark); text-decoration:none;
      transition:color .2s;
    }
    .c-value:hover { color:var(--orange); }
    .contact-photo { position:relative; overflow:hidden; }
    .contact-photo img { width:100%; height:100%; object-fit:cover; display:block; }

    /* ── FOOTER ── */
    footer {
      background:#1d0e30; text-align:center;
      padding:1.8rem; color:rgba(255,255,255,.28);
      font-size:.78rem; letter-spacing:.04em;
    }

    /* ── HAMBURGER ── */
    .nav-burger {
      display:none; flex-direction:column; justify-content:space-between;
      width:28px; height:20px; background:none; border:none; cursor:pointer; padding:0;
    }
    .nav-burger span {
      display:block; height:2px; background:var(--purple-dark);
      border-radius:2px; transition:transform .3s, opacity .3s;
    }

    /* ── MOBILE NAV OVERLAY ── */
    .mobile-nav {
      display:none; position:fixed; inset:0; z-index:300;
      background:var(--bg); flex-direction:column;
      align-items:center; justify-content:center; gap:2.5rem;
    }
    .mobile-nav.open { display:flex; }
    .mobile-nav ul { list-style:none; text-align:center; display:flex; flex-direction:column; gap:2rem; }
    .mobile-nav ul a {
      text-decoration:none; color:var(--purple-dark);
      font-family:'Poppins',sans-serif; font-size:1.6rem; font-weight:700;
      letter-spacing:.04em; transition:color .2s;
    }
    .mobile-nav ul a:hover { color:var(--orange); }
    .mobile-nav-cta {
      display:inline-block; background:var(--orange) !important;
      color:#fff !important; padding:.8rem 2.2rem; border-radius:50px;
      font-size:1rem !important; font-weight:600 !important;
    }
    .mobile-nav-close {
      position:absolute; top:1.5rem; right:1.5rem;
      background:none; border:none; font-size:1.6rem;
      color:var(--purple-dark); cursor:pointer;
    }

    /* ── RESPONSIVE — TABLET ── */
    @media(max-width:900px){
      nav { padding:1rem 1.5rem; }
      nav ul, .nav-cta { display:none; }
      .nav-burger { display:flex; }
      .hero-content { left:1.5rem; bottom:8%; max-width:90%; }
      .carousel-dots { right:1.5rem; }
      .arrow { width:38px; height:38px; }
      .about { grid-template-columns:1fr; }
      .about-img { height:65vw; }
      .about-text { padding:3.5rem 2rem; }
      .portfolio { padding:4rem 1.5rem; }
      .portfolio-grid { grid-template-columns:repeat(2,1fr); }
      .p-item:nth-child(2),.p-item:nth-child(5) { margin:0; }
      .opinions { padding:4rem 1.5rem; }
      .opinion-slide { grid-template-columns:1fr; gap:1.5rem; }
      .opinion-photo { aspect-ratio:4/3; }
      .opinion-body { padding:0 .5rem 1.5rem; }
      .contact { grid-template-columns:1fr; }
      .contact-left { padding:3rem 2rem; }
      .contact-photo { height:65vw; }
    }

    /* ── RESPONSIVE — MOBILE ── */
    @media(max-width:540px){
      .hero-content h1 { font-size:2rem; }
      .hero-content p { font-size:.9rem; }
      .hero-cta { padding:.75rem 1.6rem; font-size:.85rem; }
      .carousel-arrows { padding:0 .5rem; }
      .about-img { height:80vw; }
      .about-text { padding:2.5rem 1.2rem; }
      .about-text h2 { font-size:1.6rem; }
      .portfolio { padding:3rem 1rem; }
      .portfolio-grid { grid-template-columns:1fr; }
      .opinions { padding:3rem 1rem; }
      .opinion-slide { gap:1rem; }
      .opinion-photo { aspect-ratio:3/2; }
      .opinion-body { padding:0 .25rem 1rem; }
      .opinion-name { font-size:1rem; }
      .opinion-quote { font-size:.9rem; }
      .contact-left { padding:2.5rem 1.2rem; }
      .contact-left h2 { font-size:1.8rem; }
      .contact-photo { height:80vw; }
      .opinions-controls { margin-top:1.5rem; }
    }

    /* ── SCROLL REVEAL ── */
    .reveal {
      opacity:0;
      transform:translateY(36px);
      transition:opacity .85s ease, transform .85s ease;
    }
    .reveal.v { opacity:1; transform:none; }
    .reveal.delay-1 { transition-delay:.12s; }
    .reveal.delay-2 { transition-delay:.24s; }
    .reveal.delay-3 { transition-delay:.36s; }
  </style>
</head>

<!-- MOBILE NAV OVERLAY -->
<div class="mobile-nav" id="mobile-nav">
  <button class="mobile-nav-close" id="mobile-nav-close">&#10005;</button>
  <ul>
    <li><a href="#o-mnie">O mnie</a></li>
    <li><a href="portfolio.html">Portfolio</a></li>
    <li><a href="#opinie">Opinie</a></li>
    <li><a href="#kontakt">Kontakt</a></li>
    <li><a href="#kontakt" class="mobile-nav-cta">Zarezerwuj sesję</a></li>
  </ul>
</div>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="carousel-track" id="track"></div>
  <div class="hero-content">
    <h1 id="hHero"></h1>
    <p  id="hSub"></p>
    <a  id="hCta" class="hero-cta" href="#kontakt"></a>
  </div>
  <div class="carousel-arrows">
    <button class="arrow" id="prev">&#8592;</button>
    <button class="arrow" id="next">&#8594;</button>
  </div>
  <div class="carousel-dots" id="dots"></div>
</section>

<!-- ABOUT -->
<section class="about" id="o-mnie">
  <div class="about-img reveal">
    <img src="photo_of_me/065A3669.jpg" alt="Wanessa Kistela — fotograf">
  </div>
  <div class="about-text reveal delay-1">
    <p class="section-tag" id="aTag"></p>
    <h2 id="aHead"></h2>
    <div id="aPara"></div>
    <p class="about-signature" id="aSig"></p>
  </div>
</section>

<!-- PORTFOLIO -->
<section class="portfolio" id="portfolio">
  <div class="section-header reveal">
    <p class="section-tag" id="pTag"></p>
    <h2 id="pHead"></h2>
    <p id="pSub"></p>
  </div>
  <div class="portfolio-grid" id="pGrid"></div>
</section>

<!-- OPINIONS -->
<section class="opinions" id="opinie">
  <div class="section-header reveal">
    <p class="section-tag" id="opTag"></p>
    <h2 id="opHead"></h2>
  </div>
  <div class="opinions-inner reveal delay-1">
    <div class="opinions-viewport">
      <div class="opinions-track" id="opTrack"></div>
    </div>
  </div>
  <div class="opinions-controls reveal delay-2">
    <button class="op-arrow" id="opPrev">&#8592;</button>
    <div class="op-dots" id="opDots"></div>
    <button class="op-arrow" id="opNext">&#8594;</button>
  </div>
</section>

<!-- CONTACT -->
<section class="contact" id="kontakt">
  <div class="contact-left reveal">
    <p class="section-tag" id="cTag"></p>
    <h2 id="cHead"></h2>
    <p id="cSub" style="color:var(--muted);line-height:1.8;font-size:.97rem;margin-bottom:2.5rem;"></p>
    <div class="contact-items" id="cDet"></div>
  </div>
  <div class="contact-photo reveal delay-1">
    <img src="photo_of_me/065A3669.jpg" alt="Wanessa Kistela">
  </div>
</section>

<footer id="foot" class="reveal"></footer>

<script>
const C = CONTENT;

/* ── HERO CAROUSEL ── */
const track = document.getElementById('track');
const dotsEl = document.getElementById('dots');
C.hero.slides.forEach((s,i) => {
  track.innerHTML += `<div class="carousel-slide"><img src="${s.img}" alt="${s.alt}" style="object-position:${s.objectPosition||'center center'}"><div class="slide-overlay"></div></div>`;
  dotsEl.innerHTML += `<div class="dot${i===0?' active':''}" data-i="${i}"></div>`;
});
document.getElementById('hHero').innerHTML = C.hero.heading;
document.getElementById('hSub').innerHTML  = C.hero.subheading;
document.getElementById('hCta').textContent  = C.hero.ctaLabel;

let cur=0;
const n=C.hero.slides.length;
const allDots=document.querySelectorAll('.dot');
function goTo(x){
  cur=(x+n)%n;
  track.style.transform=`translateX(-${cur*100}%)`;
  allDots.forEach((d,i)=>d.classList.toggle('active',i===cur));
}
document.getElementById('prev').onclick=()=>goTo(cur-1);
document.getElementById('next').onclick=()=>goTo(cur+1);
allDots.forEach(d=>d.addEventListener('click',()=>goTo(+d.dataset.i)));
setInterval(()=>goTo(cur+1),3000);

/* ── ABOUT ── */
document.getElementById('aTag').textContent=C.about.tag;
document.getElementById('aHead').textContent=C.about.heading;
document.getElementById('aSig').textContent=C.about.name;
const pa=document.getElementById('aPara');
C.about.paragraphs.forEach(t=>pa.innerHTML+=`<p>${t}</p>`);

/* ── PORTFOLIO ── */
document.getElementById('pTag').textContent=C.portfolio.tag;
document.getElementById('pHead').textContent=C.portfolio.heading;
document.getElementById('pSub').textContent=C.portfolio.sub;
const pg=document.getElementById('pGrid');
C.portfolio.photos.forEach((p,i)=>{
  const d=['','delay-1','delay-2'][i%3];
  pg.innerHTML+=`<div class="p-item reveal ${d}"><img src="${p.img}" alt="${p.alt}"><div class="p-overlay"></div></div>`;
});

/* ── OPINIONS ── */
document.getElementById('opTag').textContent=C.opinions.tag;
document.getElementById('opHead').textContent=C.opinions.heading;
const opTrack=document.getElementById('opTrack');
const opDotsEl=document.getElementById('opDots');
C.opinions.items.forEach((o,i)=>{
  opTrack.innerHTML+=`<div class="opinion-slide">
    <div class="opinion-photo"><img src="${o.img}" alt="${o.name}"></div>
    <div class="opinion-body">
      <p class="opinion-name">${o.name}</p>
      <p class="opinion-session">${o.session}</p>
      <p class="opinion-quote">${o.quote}</p>
    </div>
  </div>`;
  opDotsEl.innerHTML+=`<button class="op-dot${i===0?' active':''}" data-i="${i}"></button>`;
});
let opCur=0;
const opN=C.opinions.items.length;
const opDotBtns=document.querySelectorAll('.op-dot');
function opGoTo(x){
  opCur=(x+opN)%opN;
  opTrack.style.transform=`translateX(-${opCur*100}%)`;
  opDotBtns.forEach((d,i)=>d.classList.toggle('active',i===opCur));
}
document.getElementById('opPrev').onclick=()=>opGoTo(opCur-1);
document.getElementById('opNext').onclick=()=>opGoTo(opCur+1);
opDotBtns.forEach(d=>d.addEventListener('click',()=>opGoTo(+d.dataset.i)));

/* ── CONTACT ── */
document.getElementById('cTag').textContent=C.contact.tag;
document.getElementById('cHead').textContent=C.contact.heading;
document.getElementById('cSub').textContent=C.contact.sub;
document.getElementById('cDet').innerHTML=`
  <div class="c-item">
    <div class="c-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/>
      </svg>
    </div>
    <div class="c-item-text">
      <p class="c-label">${C.contact.location.label}</p>
      <p class="c-value">${C.contact.location.value}</p>
    </div>
  </div>
  <div class="c-item">
    <div class="c-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
    </div>
    <div class="c-item-text">
      <p class="c-label">${C.contact.phone.label}</p>
      <p class="c-value">${C.contact.phone.value}</p>
    </div>
  </div>
  <div class="c-item">
    <div class="c-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
      </svg>
    </div>
    <div class="c-item-text">
      <p class="c-label">${C.contact.email.label}</p>
      <a class="c-value" href="mailto:${C.contact.email.value}">${C.contact.email.value}</a>
    </div>
  </div>
  <div class="c-item">
    <div class="c-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="c-item-text">
      <p class="c-label">${C.contact.insta.label}</p>
      <a class="c-value" href="${C.contact.insta.href}" target="_blank">${C.contact.insta.handle}</a>
    </div>
  </div>`;

/* ── FOOTER ── */
document.getElementById('foot').textContent=C.footer;

/* ── MOBILE NAV ── */
const mobileNav = document.getElementById('mobile-nav');
document.getElementById('nav-burger').onclick = () => mobileNav.classList.add('open');
document.getElementById('mobile-nav-close').onclick = () => mobileNav.classList.remove('open');
mobileNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => mobileNav.classList.remove('open')));

/* ── NAV SHADOW ON SCROLL ── */
window.addEventListener('scroll',()=>{
  document.getElementById('nav').style.boxShadow=
    window.scrollY>20?'0 2px 24px rgba(74,30,107,.09)':'none';
});

/* ── SCROLL REVEAL ── */
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('v');
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
</script>
</body>
</html>
